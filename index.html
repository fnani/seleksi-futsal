      <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <div class="bg-emerald-500 text-slate-950 font-bold px-3.5 py-2.5 rounded-xl text-base">SF</div>
          <div>
            <h1 class="text-lg font-bold text-slate-100">Sistem Seleksi Futsal</h1>
            <p class="text-sm text-slate-400">Tim Futsal Ponprov Kab. Kediri</p>
          </div>
        </div>

        <!-- Indicator Sync -->
        <div class="flex items-center gap-2 bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800 text-xs">
          <span id="sync-status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
          <span id="sync-status-text" class="text-slate-300 font-semibold">Connecting Cloud...</span>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-6 py-8">

        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">

            <h2 class="text-lg font-bold text-slate-100">Daftar Kehadiran Peserta</h2>
            <p class="text-sm text-slate-400">Total Peserta Terdaftar: <span id="badge-total" class="font-bold text-emerald-400">0</span></p>
          </div>
          
          <div class="flex flex-wrap gap-3">

            <button id="btn-inject-data" type="button" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-sm transition shadow flex items-center gap-2">

            <button id="btn-open-modal" type="button" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold rounded-xl text-sm transition shadow">
              + Tambah Peserta Baru
            </button>
          </div>
        </div>

        <!-- Pencarian & Filter -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <input type="text" id="search-input" placeholder="Cari nama atau asal sekolah..." class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-slate-100 placeholder-slate-500" />
          <select id="filter-posisi" class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-slate-300">
            <option value="">Semua Posisi</option>
            <option value="GK">GK (Kiper)</option>
            <option value="Anchor">Anchor</option>
            <option value="Flank">Flank</option>
            <option value="Pivot">Pivot</option>
          </select>
        </div>

        <!-- Tabel Peserta -->
        <div class="overflow-x-auto rounded-xl border border-slate-800">
          <table class="w-full text-left border-collapse text-sm">
            <thead class="bg-slate-950 text-slate-400 uppercase font-bold text-xs">

            </thead>
            <tbody id="presensi-table-body" class="divide-y divide-slate-800">

            </tbody>
          </table>

    <!-- MODAL TAMBAH PESERTA -->
    <div id="modal-add-participant" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">

        <div class="space-y-3">

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
      import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDARoARtFkgQB-7J_mG_DDAcSIIwzVKaG8",
        authDomain: "seleksi-futsal.firebaseapp.com",
        projectId: "seleksi-futsal",
        storageBucket: "seleksi-futsal.firebasestorage.app",
        messagingSenderId: "135886803788",
        appId: "1:135886803788:web:fc201b65cc8d3b879ff5e9"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const docRef = doc(db, "futsal_data", "participants");

      let participantsList = [];

      function setStatus(text, isGreen) {
        document.getElementById("sync-status-text").innerText = text;
        document.getElementById("sync-status-dot").className = `w-2.5 h-2.5 rounded-full ${isGreen ? 'bg-emerald-500' : 'bg-rose-500'} animate-pulse`;
      }

      function renderTable() {
        const tbody = document.getElementById("presensi-table-body");
        const search = (document.getElementById("search-input").value || "").toLowerCase();
        const filterPos = document.getElementById("filter-posisi").value || "";
        
        document.getElementById("badge-total").innerText = participantsList.length;

        const filtered = participantsList.filter(p => {
          const matchSearch = p.name.toLowerCase().includes(search) || p.school.toLowerCase().includes(search);
          const matchPos = filterPos === "" || p.position === filterPos;
          return matchSearch && matchPos;
        });

        if (filtered.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-500">Tidak ada peserta yang cocok.</td></tr>`;
          return;
        }

        tbody.innerHTML = "";
        filtered.forEach((p, idx) => {
          const tr = document.createElement("tr");
          tr.className = "hover:bg-slate-800/50";
          tr.innerHTML = `
            <td class="p-4 text-center text-slate-500">${idx + 1}</td>
            <td class="p-4 font-semibold text-slate-100">${p.name}</td>
            <td class="p-4 text-slate-300">${p.school}</td>
            <td class="p-4 text-slate-400">${p.phone}</td>
            <td class="p-4 text-center"><span class="px-2 py-1 rounded bg-slate-800 text-xs font-bold">${p.position}</span></td>
            <td class="p-4 text-right">
              <button class="text-rose-400 hover:text-rose-300 text-xs font-bold btn-delete" data-id="${p.id}">Hapus</button>
            </td>
          `;
          tbody.appendChild(tr);
        });

        document.querySelectorAll(".btn-delete").forEach(btn => {
          btn.onclick = async (e) => {
            const pId = e.target.getAttribute("data-id");
            participantsList = participantsList.filter(item => item.id !== pId);
            await setDoc(docRef, { list: participantsList });
          };
        });
      }

      // Realtime Listener
      onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
          participantsList = docSnap.data().list || [];
        } else {
          participantsList = [];
        }
        renderTable();
        setStatus("Live Cloud Active", true);
      }, (err) => {
        console.error(err);
        setStatus("Cloud Connection Error", false);
      });

      // Filter & Search Events
      document.getElementById("search-input").oninput = renderTable;
      document.getElementById("filter-posisi").onchange = renderTable;

      // Handle Modal
      const modal = document.getElementById("modal-add-participant");
      document.getElementById("btn-open-modal").onclick = () => modal.classList.remove("hidden");
      document.getElementById("btn-close-modal").onclick = () => modal.classList.add("hidden");
      document.getElementById("btn-cancel-modal").onclick = () => modal.classList.add("hidden");

      // Handle Simpan Manual
      document.getElementById("btn-save-participant").onclick = async () => {
        const nameVal = document.getElementById("new-p-name").value.trim();
        const schoolVal = document.getElementById("new-p-school").value.trim();
        const phoneVal = document.getElementById("new-p-phone").value.trim();
        const posVal = document.getElementById("new-p-pos").value;

        if (!nameVal) {
          alert("Nama wajib diisi!");
          return;
        }

        participantsList.push({
          id: 'p_' + Date.now(),
          name: nameVal,
          school: schoolVal || "-",
          phone: phoneVal || "-",
          position: posVal,
          present: false
        });

        await setDoc(docRef, { list: participantsList });
        document.getElementById("new-p-name").value = "";
        document.getElementById("new-p-school").value = "";
        document.getElementById("new-p-phone").value = "";
        modal.classList.add("hidden");
      };
