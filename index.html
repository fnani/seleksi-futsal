<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Seleksi Futsal - Tim Futsal Ponprov Kab. Kediri</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .tab-content { display: none; }
      .tab-content.active { display: block; }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
    
    <!-- Header / Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-md">
      <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <div class="bg-emerald-500 text-slate-950 font-bold px-3.5 py-2.5 rounded-xl text-base">SF</div>
          <div>
            <h1 class="text-lg font-bold text-slate-100">Sistem Seleksi Futsal</h1>
            <p class="text-sm text-slate-400">Tim Futsal Ponprov Kab. Kediri</p>
          </div>
        </div>

        <!-- Indicator Sync -->
        <div class="flex items-center gap-2 bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800 text-xs">
          <span id="sync-status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
          <span id="sync-status-text" class="text-slate-300 font-semibold">Connecting Cloud...</span>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-6 py-8">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
          <div>
            <h2 class="text-lg font-bold text-slate-100">Daftar Kehadiran Peserta</h2>
            <p class="text-sm text-slate-400">Total Peserta Terdaftar: <span id="badge-total" class="font-bold text-emerald-400">0</span></p>
          </div>
          <button id="btn-open-modal" type="button" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold rounded-xl text-sm transition shadow">
            + Tambah Peserta Baru
          </button>
        </div>

        <div class="overflow-x-auto rounded-xl border border-slate-800">
          <table class="w-full text-left border-collapse text-sm">
            <thead class="bg-slate-950 text-slate-400 uppercase font-bold text-xs">
              <tr>
                <th class="p-4">Nama Peserta</th>
                <th class="p-4">Asal Sekolah</th>
                <th class="p-4">No. HP</th>
                <th class="p-4 text-center">Posisi</th>
                <th class="p-4 text-right">Aksi</th>
              </tr>
            </thead>
            <tbody id="presensi-table-body" class="divide-y divide-slate-800">
              <tr>
                <td colspan="5" class="p-4 text-center text-slate-500">Memuat data...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- MODAL TAMBAH PESERTA -->
    <div id="modal-add-participant" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
      <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 space-y-4 shadow-2xl">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
          <h3 class="font-bold text-base text-slate-100">Tambah Peserta Baru</h3>
          <button id="btn-close-modal" type="button" class="text-slate-400 hover:text-slate-200 font-bold text-lg">&times;</button>
        </div>
        
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Nama Lengkap *</label>
            <input type="text" id="new-p-name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500" placeholder="Masukkan nama..." />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Asal Sekolah</label>
            <input type="text" id="new-p-school" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500" placeholder="Asal sekolah..." />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Nomor HP</label>
            <input type="text" id="new-p-phone" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500" placeholder="08xxxxxxxxxx" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Posisi</label>
            <select id="new-p-pos" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-300 focus:outline-none focus:border-emerald-500">
              <option value="Flank">Flank</option>
              <option value="Anchor">Anchor</option>
              <option value="Pivot">Pivot</option>
              <option value="GK">GK (Kiper)</option>
            </select>
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
          <button id="btn-cancel-modal" type="button" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold">Batal</button>
          <button id="btn-save-participant" type="button" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-slate-950 rounded-xl text-xs font-bold">Simpan Peserta</button>
        </div>
      </div>
    </div>

    <!-- FIREBASE SDK & APPLICATION LOGIC -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
      import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDARoARtFkgQB-7J_mG_DDAcSIIwzVKaG8",
        authDomain: "seleksi-futsal.firebaseapp.com",
        projectId: "seleksi-futsal",
        storageBucket: "seleksi-futsal.firebasestorage.app",
        messagingSenderId: "135886803788",
        appId: "1:135886803788:web:fc201b65cc8d3b879ff5e9"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const docRef = doc(db, "futsal_data", "participants");

      let participantsList = [];

      // Status Indicator Update
      function setStatus(text, isGreen) {
        document.getElementById("sync-status-text").innerText = text;
        document.getElementById("sync-status-dot").className = `w-2.5 h-2.5 rounded-full ${isGreen ? 'bg-emerald-500' : 'bg-rose-500'} animate-pulse`;
      }

      // Render Table
      function renderTable() {
        const tbody = document.getElementById("presensi-table-body");
        document.getElementById("badge-total").innerText = participantsList.length;

        if (participantsList.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">Belum ada peserta. Klik "+ Tambah Peserta Baru".</td></tr>`;
          return;
        }

        tbody.innerHTML = "";
        participantsList.forEach((p, idx) => {
          const tr = document.createElement("tr");
          tr.className = "hover:bg-slate-800/50";
          tr.innerHTML = `
            <td class="p-4 font-semibold text-slate-100">${p.name}</td>
            <td class="p-4 text-slate-300">${p.school}</td>
            <td class="p-4 text-slate-400">${p.phone}</td>
            <td class="p-4 text-center"><span class="px-2 py-1 rounded bg-slate-800 text-xs font-bold">${p.position}</span></td>
            <td class="p-4 text-right">
              <button class="text-rose-400 hover:text-rose-300 text-xs font-bold btn-delete" data-idx="${idx}">Hapus</button>
            </td>
          `;
          tbody.appendChild(tr);
        });

        // Binding Tombol Hapus
        document.querySelectorAll(".btn-delete").forEach(btn => {
          btn.onclick = async (e) => {
            const index = parseInt(e.target.getAttribute("data-idx"));
            participantsList.splice(index, 1);
            await setDoc(docRef, { list: participantsList });
          };
        });
      }

      // Realtime Listener Firebase
      onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
          participantsList = docSnap.data().list || [];
        } else {
          participantsList = [];
        }
        renderTable();
        setStatus("Live Cloud Active", true);
      }, (err) => {
        console.error(err);
        setStatus("Cloud Connection Error", false);
      });

      // Handle Modal Visibility
      const modal = document.getElementById("modal-add-participant");
      document.getElementById("btn-open-modal").onclick = () => modal.classList.remove("hidden");
      document.getElementById("btn-close-modal").onclick = () => modal.classList.add("hidden");
      document.getElementById("btn-cancel-modal").onclick = () => modal.classList.add("hidden");

      // Handle Simpan Peserta Manual
      document.getElementById("btn-save-participant").onclick = async () => {
        const nameVal = document.getElementById("new-p-name").value.trim();
        const schoolVal = document.getElementById("new-p-school").value.trim();
        const phoneVal = document.getElementById("new-p-phone").value.trim();
        const posVal = document.getElementById("new-p-pos").value;

        if (!nameVal) {
          alert("Nama wajib diisi!");
          return;
        }

        const newPlayer = {
          id: 'p_' + Date.now(),
          name: nameVal,
          school: schoolVal || "-",
          phone: phoneVal || "-",
          position: posVal,
          present: false
        };

        participantsList.push(newPlayer);

        try {
          // Push langsung ke Firebase
          await setDoc(docRef, { list: participantsList });
          
          // Clear Input
          document.getElementById("new-p-name").value = "";
          document.getElementById("new-p-school").value = "";
          document.getElementById("new-p-phone").value = "";
          
          modal.classList.add("hidden");
        } catch (error) {
          alert("Gagal menyimpan ke Firebase: " + error.message);
        }
      };
    </script>
  </body>
</html>
